name: Feature request
description: A capability that's missing
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What can't you do today, from the user's perspective.
      validations:
          required: true

    - type: textarea
      id: proposal
      attributes:
          label: Proposal
          description: What should exist instead. Optional — a clear problem is enough.
